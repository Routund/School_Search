    {% extends 'base.html' %}

    {% block content %}

    <script src="/static/home.js" type="text/javascript"></script>

    <div id= "homepage_content">
        <h1 id="home_title">
            Burnside File Searcher
        </h1>
        <p id = "homepage_text">
        Search through 1000's across google drive and Burnside High School's various websites.

        To search, sign in with google. You may be asked to sign in again to give authorization
        </p>
        <div id="home_centre">
            <div id="g_id_onload"
                data-client_id="178139804807-klqupaeafut06leolnflj3amh7ucfkim.apps.googleusercontent.com"
                data-context="signin"
                data-ux_mode="redirect"
                data-login_uri="http://localhost:5000/login"
                data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                data-type="standard"
                data-shape="pill"
                data-theme="filled_blue"
                data-text="signin_with"
                data-size="large"
                data-logo_alignment="left"
                data-width="100"
                id="gsi">
            </div>
        </div>
    </div>
    <footer id="homepage_footer">
            Made by Aditya Bansal
    </footer>
    {% endblock%}
