{% extends 'base.html' %}

{% block content %}

<head>
    <script src="/static/results.js" type="text/javascript"></script>
</head>


<div class ="results_search_bar_div">
    <img src = "/static/magnify.png" class = "result_search_bar_icon">
    <input type="text" id = "search_bar" value = "{{query}}" class = "results_search_bar" max="100">
</div>
<!-- 1: URL, 2: Title, 3: Source, 4:Intro (0 is doc score for ranking)-->
{% if results | count > 0 %}
 <div id="result_container" data-query = "{{query}}">
    {% for result in results %}
        <a href = "{{ result[1] }}" class = "result_container" target="_blank">
            <h2 class = "result_title">{{result[2]}}</h2>
            <h5 class = "result_source">{{result[3]}}</h5>
            <p class = "result_text">{{result[4]}}</p>
        </a>    
        <hr class = "resultDivider">
    {% endfor %}
 </div>
    <div id = "loading_results">
        <img src = "/static/loading.gif" height="50px">
    </div>
{% else %}
    No results found!
{% endif %}
{% endblock %}
